name: Update MASTER_PROMPT

on:
  push:
    branches: [ main ]
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  update-master-prompt:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Generate auto session from latest commit
        run: |
          python3 tools/generate_auto_session.py

      - name: Find generated session file
        id: find
        run: |
          s=$(ls prompts/sessions/auto-*.md 2>/dev/null | tail -n1 || true)
          echo "SESSION_FILE=$s" >> $GITHUB_OUTPUT

      - name: Update MASTER_PROMPT.md
        run: |
          if [ -n "${{ steps.find.outputs.SESSION_FILE }}" ]; then
            python3 scripts/update_master_prompt.py "${{ steps.find.outputs.SESSION_FILE }}"
            git status --porcelain
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/prompts/MASTER_PROMPT.md docs/prompts/sessions/*.md || true
            if ! git diff --cached --quiet; then
              git commit -m "chore: auto-update MASTER_PROMPT.md (action)"
              git push
            else
              echo "No changes to commit"
            fi
          else
            echo "No auto session file found"
          fi
