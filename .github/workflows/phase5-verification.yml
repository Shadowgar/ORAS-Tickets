name: Phase5 Verification

on:
  push:
    branches:
    - main
    - master
  pull_request:


jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 45

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3'
        tools: composer:v2

    - name: Install PHP dependencies
      run: composer install --no-interaction --prefer-dist

    - name: Version consistency
      run: composer version-check

    - name: Role capability model
      run: composer role-check

    - name: PHPCS gate regression checks
      run: bash scripts/qbo-phpcs-diff-check-tests.sh

    - name: PHPCS committed release comparison
      run: bash scripts/qbo-phpcs-diff-check.sh --baseline 1440cab86c1b7cb3de311764f0c28886f2da4a4b

    - name: PHPStan
      run: composer phpstan

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Start wp-env
      run: npx --yes @wordpress/env start

    - name: Run Phase 5 integration checks
      env:
        ORAS_WP_ENV_DIR: .
        ORAS_WP_ENV_CMD: npx --yes @wordpress/env
      run: bash scripts/run-phase5-integration-checks.sh

    - name: Run Reports integration checks
      env:
        ORAS_WP_ENV_DIR: .
        ORAS_WP_ENV_CMD: npx --yes @wordpress/env
      run: bash scripts/run-reports-integration-checks.sh

    - name: Run Board Reports Observer Pass integration checks
      env:
        ORAS_WP_ENV_DIR: .
        ORAS_WP_ENV_CMD: npx --yes @wordpress/env
      run: bash scripts/run-board-reports-integration-checks.sh

    - name: Run QBO integration checks
      env:
        ORAS_WP_ENV_DIR: .
        ORAS_WP_ENV_CMD: npx --yes @wordpress/env
      run: bash scripts/run-qbo-integration-checks.sh

    - name: Stop wp-env
      if: always()
      run: npx --yes @wordpress/env stop || true
