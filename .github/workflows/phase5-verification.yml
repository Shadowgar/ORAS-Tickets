name: Phase5 Verification

on:
  push:
    branches:
    - main
    - master
  pull_request:


jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 45

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3'
        tools: composer:v2

    - name: Install PHP dependencies
      run: composer install --no-interaction --prefer-dist

    - name: Version consistency
      run: composer version-check

    - name: Role capability model
      run: composer role-check

    - name: PHPCS gate regression checks
      run: bash scripts/qbo-phpcs-diff-check-tests.sh

    - name: PHPCS committed release comparison
      run: bash scripts/qbo-phpcs-diff-check.sh --baseline 1440cab86c1b7cb3de311764f0c28886f2da4a4b

    - name: PHPStan
      run: composer phpstan

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '22.22.0'

    - name: Install Node dependencies
      run: npm ci --ignore-scripts

    - name: Stage pinned WordPress integration plugins
      run: |
        mkdir -p oras-tickets/.ci-integration-deps
        curl --fail --silent --show-error --location --max-time 120 \
          --output oras-tickets/.ci-integration-deps/the-events-calendar.zip \
          https://downloads.wordpress.org/plugin/the-events-calendar.6.17.3.1.zip
        curl --fail --silent --show-error --location --max-time 120 \
          --output oras-tickets/.ci-integration-deps/woocommerce.zip \
          https://downloads.wordpress.org/plugin/woocommerce.11.0.1.zip
        echo 'f7c4bb35c06a127ae50f78555bb001a2eaed2ec93a79e069b94ed58982eca64f  oras-tickets/.ci-integration-deps/the-events-calendar.zip' | sha256sum --check --strict
        echo 'da189b6616c610d15a2106f93151dab81b78f83e075bcefce221ac0d00b4fa21  oras-tickets/.ci-integration-deps/woocommerce.zip' | sha256sum --check --strict

    - name: Start wp-env
      run: ./node_modules/.bin/wp-env start

    - name: Install pinned WordPress integration plugins
      run: |
        ./node_modules/.bin/wp-env run cli wp plugin install /var/www/html/wp-content/plugins/oras-tickets/.ci-integration-deps/the-events-calendar.zip --activate
        ./node_modules/.bin/wp-env run cli wp plugin install /var/www/html/wp-content/plugins/oras-tickets/.ci-integration-deps/woocommerce.zip --activate

    - name: Run Phase 5 integration checks
      env:
        ORAS_WP_ENV_DIR: .
        ORAS_WP_ENV_CMD: ./node_modules/.bin/wp-env
      run: bash scripts/run-phase5-integration-checks.sh

    - name: Run Reports integration checks
      env:
        ORAS_WP_ENV_DIR: .
        ORAS_WP_ENV_CMD: ./node_modules/.bin/wp-env
      run: bash scripts/run-reports-integration-checks.sh

    - name: Run Board Reports Observer Pass integration checks
      env:
        ORAS_WP_ENV_DIR: .
        ORAS_WP_ENV_CMD: ./node_modules/.bin/wp-env
      run: bash scripts/run-board-reports-integration-checks.sh

    - name: QBO runner guard regression checks
      env:
        ORAS_WP_ENV_DIR: .
        ORAS_WP_ENV_CMD: ./node_modules/.bin/wp-env
      run: bash scripts/qbo-runner-guard-tests.sh

    - name: Run QBO integration checks
      env:
        ORAS_WP_ENV_DIR: .
        ORAS_WP_ENV_CMD: ./node_modules/.bin/wp-env
      run: scripts/run-qbo-integration-checks.sh

    - name: Stop wp-env
      if: always()
      run: ./node_modules/.bin/wp-env stop || true

    - name: Remove staged WordPress integration plugins
      if: always()
      run: |
        rm -f -- oras-tickets/.ci-integration-deps/the-events-calendar.zip oras-tickets/.ci-integration-deps/woocommerce.zip
        rmdir oras-tickets/.ci-integration-deps 2>/dev/null || true
